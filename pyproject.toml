[project]
name = "iconclass-classification"
version = "0.1.0"
description = "Reproducible pipeline to classify digital objects using Iconclass VLM via Ollama"
authors = [{ name = "Stadt Geschichte Basel", email = "info@stadtgeschichtebasel.ch" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
    "click>=8.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
  "pytest>=8.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["iconclass_classification"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
iconclass-classification = "iconclass_classification.cli:cli"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
